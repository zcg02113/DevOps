{% extends 'index.html' %}
{% block title %}Service{% endblock %}
{% block item-3 %}layui-nav-itemed{% endblock %}
{% block item-3-1 %}layui-this{% endblock %}
{% block  context %}
     <span class="layui-breadcrumb">
        <a href="{% url 'home' %}">首页</a>
        <a href="#">负载均衡</a>
        <a><cite>Service</cite></a>
    </span>
    <hr>
    <div class="layui-card" style="display: none" id="create">
    <div class="layui-card-body">
        <fieldset class="layui-elem-field layui-field-title" style="margin-top: 20px;">
            <legend>创建 Service</legend>
        </fieldset>

        <form class="layui-form" onclick="return false">

            <div class="layui-form-item">
                <label class="layui-form-label">服务名称：</label>
                <div class="layui-input-block">
                    <input type="text" name="name" lay-verify="required"
                           lay-reqtext="服务名称是必填项！"
                           placeholder="请输入服务名称"
                           autocomplete="off" class="layui-input">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">命名空间：</label>
                <div class="layui-input-block">
                    <select name="namespace" lay-verify="required" id="ns">
                        <option value="">请选择命名空间</option>
                        <!-- 选项会通过JS动态加载 -->
                    </select>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">服务类型：</label>
                <div class="layui-input-block">
                    <input type="radio" name="serviceType" value="ClusterIP" title="ClusterIP" checked>
                    <input type="radio" name="serviceType" value="NodePort" title="NodePort">
                    <input type="radio" name="serviceType" value="LoadBalancer" title="LoadBalancer">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">标签：</label>
                <div class="layui-input-block">
                  <input type="text" name="labels" lay-verify="required" lay-reqtext="标签是必填项，不能为空！" placeholder="示例: project=ms,app=gateway" autocomplete="off" class="layui-input">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">端口配置：</label>
                <div class="layui-input-block">
                    <div class="port-config" id="port-container">
                        <div class="port-row">
                            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                                <input type="text" name="ports[0][port_name]"
                                       placeholder="端口名称"
                                       class="layui-input" style="width: 120px;">
                                <input type="text" name="ports[0][port]"
                                       placeholder="服务端口"
                                       class="layui-input" style="width: 120px;">
                                <input type="text" name="ports[0][targetPort]"
                                       placeholder="目标端口"
                                       class="layui-input" style="width: 120px;">
                                <select name="ports[0][protocol]" class="layui-input" style="width: 50px;">
                                    <option value="TCP">TCP</option>
                                    <option value="UDP">UDP</option>
                                </select>
                                <button type="button" class="layui-btn layui-btn-danger layui-btn-sm"
                                        onclick="removePortRow(this)" style="display: none;">
                                    <i class="layui-icon">&#x1006;</i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="layui-btn layui-btn-sm" onclick="addPortRow()">
                        <i class="layui-icon">&#xe654;</i> 添加端口
                    </button>
                </div>
            </div>

            <!-- 如果是NodePort类型，显示节点端口范围 -->
            <div class="layui-form-item nodeport-range" style="display: none;">
                <label class="layui-form-label">节点端口：</label>
                <div class="layui-input-block">
                    <input type="text" name="nodePort"
                           placeholder="可选，留空系统自动分配 (30000-32767)"
                           autocomplete="off" class="layui-input">
                </div>
            </div>

            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button type="submit" class="layui-btn" lay-submit="" lay-filter="btn">创建服务</button>
                    <button type="reset" class="layui-btn layui-btn-primary" onclick="resetForm()">重置</button>
                </div>
            </div>
        </form>
    </div>
</div>
    <div class="layui-card">
        {% csrf_token %}
        <div class="layui-card-body">
            <div class="layui-row">
                <div class="layui-col-md12">
                    <input type="text" name="name" lay-verify="title" placeholder="请输入名称" class="layui-input" style="width: 150px;float: left">
                    <button class="layui-btn" id="searchBtn" style="float: left">搜索</button>
                    <button class="layui-btn" id="createSvc">创建</button>
                </div>

                <div class="layui-col-md12" style="margin-top: 10px">
                    <table id="demo" lay-filter="test"></table>
                    <!--  行工具 -->
                    <script type="text/html" id="barDemo">
                      <a class="layui-btn layui-btn-xs" lay-event="yaml">YAML</a>
                      <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
                    </script>
                </div>

            </div>
        </div>
    </div>
{% endblock %}
{% block js %}
<script>
    let portCounter = 1;
    let selectorCounter = 0;
// 添加端口行
    function addPortRow() {
        const container = document.getElementById('port-container');
        const row = document.createElement('div');
        row.className = 'port-row';
        row.innerHTML = `
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
            <input type="text" name="ports[${portCounter}][port_name]"
                   placeholder="端口名称"
                   class="layui-input" style="width: 120px;">
            <input type="text" name="ports[${portCounter}][port]"
                   placeholder="服务端口"
                   class="layui-input" style="width: 120px;">
            <input type="text" name="ports[${portCounter}][targetPort]"
                   placeholder="目标端口"
                   class="layui-input" style="width: 120px;">
            <select name="ports[${portCounter}][protocol]" class="layui-input" style="width: 50px;">
                <option value="TCP">TCP</option>
                <option value="UDP">UDP</option>
            </select>
            <button type="button" class="layui-btn layui-btn-danger layui-btn-sm"
                    onclick="removePortRow(this)">
                <i class="layui-icon">&#x1006;</i>
            </button>
        </div>
        `;
        container.appendChild(row);
        portCounter++;
    }
    //删除端口行
    function removePortRow(button) {
        const row = button.closest('.port-row');
        if (row && document.querySelectorAll('.port-row').length > 1) {
            row.remove();
        }
    }
    // 监听服务类型变化(NodePort)
    document.addEventListener('DOMContentLoaded', function() {
        const serviceTypeRadios = document.querySelectorAll('input[name="serviceType"]');
        const nodePortRange = document.querySelector('.nodeport-range');

        serviceTypeRadios.forEach(radio => {
            radio.addEventListener('change', function() {
                if (this.value === 'NodePort') {
                    nodePortRange.style.display = 'block';
                } else {
                    nodePortRange.style.display = 'none';
                }
            });
        });
    });
    //重置
    function resetForm() {
        portCounter = 1;
        selectorCounter = 0;
        const portContainer = document.getElementById('port-container');
        const selectorContainer = document.getElementById('selector-container');

    // 重置端口
        portContainer.innerHTML = `
            <div class="port-row">
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <input type="text" name="ports[0][port_name]"
                        placeholder="端口名称"
                        class="layui-input" style="width: 120px;">
                    <input type="text" name="ports[0][port]"
                       placeholder="服务端口"
                       class="layui-input" style="width: 120px;">
                    <input type="text" name="ports[0][targetPort]"
                       placeholder="目标端口"
                       class="layui-input" style="width: 120px;">
                    <select name="ports[0][protocol]" class="layui-input" style="width: 100px;">
                        <option value="TCP">TCP</option>
                        <option value="UDP">UDP</option>
                    </select>
                    <button type="button" class="layui-btn layui-btn-danger layui-btn-sm"
                        onclick="removePortRow(this)" style="display: none;">
                        <i class="layui-icon">&#x1006;</i>
                    </button>
                </div>
            </div>
        `;

    // 重置选择器
    selectorContainer.innerHTML = '';
}

//获取当前命名空间
    var storage = window.sessionStorage;
    var namespace = storage.getItem('namespace');   //从session获取namespace的值layui.use('table',function (){


    layui.use(['table','form'], function(){
    var table = layui.table;
    var $ = layui.jquery
    var form = layui.form
    table.render({      //数据表格,使用table模块
        elem: '#demo'
        ,url:'{% url 'service_api' %}?namespace=' + namespace
        ,toolbar: '#toolbarDemo' //开启头部工具栏，并为其绑定左侧模板
        ,defaultToolbar: ['filter', 'exports', 'print', { //自定义头部工具栏右侧图标。如无需自定义，去除该参数即可
            title: '刷新'
            ,layEvent: 'LAYTABLE_TIPS'
            ,icon: 'layui-icon-refresh'
            ,onClick: function(obj) {
                location.reload()
            }
    }]
    ,cols: [[
        {field: 'name', title: '名称', sort: true, width: 150}
        ,{field: 'namespace', title: '命名空间',width: 150, sort: true}
        ,{field: 'type', title: '类型',width: 120, sort: true}
        ,{field: 'cluster_ip', title: '集群IP',width: 150}
        ,{field: 'ports', title: '端口信息',templet: portsFormat}
        ,{field: 'labels', title: '标签', templet: labelsFormat}
        ,{field: 'selector', title: 'Pod 标签选择器', templet: selecotrFormat}
        ,{field: 'endpoint', title: '后端 Pod',width: 100}
        ,{field: 'create_time', title: '创建时间'}
        ,{fixed: 'right', title:'操作', toolbar: '#barDemo',width: 200}
    ]]
        ,page: true
        ,id: 'TT'
    });
    // 标签格式化，是一个对象
    function labelsFormat(d){
        result = "";
        if(d.labels == null){
            return "None"
        } else {
            for (let key in d.labels) {
                result += '<span style="border: 1px ;border-radius: 8px">' + key + ':' + d.labels[key] + '</span><br>'
            }
            return result
        }
    }
    function selecotrFormat(d){
        result = "";
        for(let key in d.selector) {
           result += '<span style="border: 1px ;border-radius: 8px">' +
                key + ':' + d.selector[key] +
                   '</span><br>'
        }
        return result
    }
    function portsFormat(d) {
        result = "";
        for(let key in d.ports) {
            data = d.ports[key];
            result += '名称: ' + data.port_name + '<br>' +
                    '端口: ' + data.port + '<br>' +
                    '协议: ' + data.protocol + '<br>' +
                    '容器端口: ' + data.target_port + '<br>'
        }
        return result
    }
    table.on('tool(test)', function(obj){
        var data = obj.data;
        var csrf_token = $('[name="csrfmiddlewaretoken"]').val();
        if(obj.event === 'del'){
            layer.confirm('真的要删除这个Service吗？', function(index){
                $.ajax({
                    type: "DELETE",
                    url: "{% url 'service_api' %}",
                    data: data,
                    headers: {'X-CSRFToken': csrf_token},  // 放到请求头，django也会验证这字段
                    success: function (result) {
                        if (result.code === '0') {
                            layer.msg(result.msg, {icon: 6})
                        } else {
                            layer.msg(result.msg, {icon: 5})
                        }
                    },
                    error: function () {
                        layer.msg("服务器接口异常！", {icon: 5})
                    }
                });

                layer.close(index);
            });
        } else if(obj.event === 'yaml'){
            layer.open({
                title: 'YAML',
                type: 2,  //内嵌层，从另一个网址加载
                area: ['50%','60%'],
                content: '{% url 'ace_editor' %}?resource=service&' + 'namespace=' + data['namespace'] + '&name=' + data['name']//将值传给后端
            })
        }
    });
    // 监听搜索事件
    $(document).on('click','#searchBtn', function () {
        var input_val = $('.layui-input').val();
       // var input_val = $("input[name='name']").val();
        table.reload('TT', {
            where: {   //设定异步数据接口的额外参数，任意设置
                search_key: input_val
            },
            page: {
                curr: 1  //重新从第 1 页开始
            }
        })
    })
    $("#createSvc").on("click", function () {    //点击创建触发
        layer.open({            //点击触发弹出层
            type: 1,
            area: ['40%', '70%'], // 调整弹出层长宽
            content: $('#create')  //让id=create的页面显示
            ,success: function (index, layero) {
                form.render('radio');
                form.render('checkbox');
                $.ajax({
                    type: 'GET',
                    url: '{% url 'namespace_api' %}',
                    success: function (res) {
                        if (res.code === 0) {
                            for (let index in res.data) {
                                row = res.data[index];

                                $('#ns').append('<option value=' + row.name + '>' + row.name + '</option>')
                            }
                            form.render('select');  //渲染表单属性的下拉框和单选框(需在访问api之后再进行渲染)
                        }else {
                            layer.open({
                                type: 0,
                                title: ['命名空间查询失败'],
                                content: '<span style="color: red ;font-size: 18px">' + res.msg + '</span>'
                            })
                        }
                    },
                    error: function (){
                        layer.open({
                            type: 0,
                            title: ['异常信息'],
                            content: '获取命名空间列表失败！请检查k8s集群地址或者服务器！'
                        })
                    }
                });
                form.on('submit(btn)', function(data){      //点击提交获取表单数据
                    data = data.field;
                    console.log(data)
                    var csrf_token = $("input[name='csrfmiddlewaretoken']").val();
                    data['csrfmiddlewaretoken'] = csrf_token;
                    $.ajax({
                        type: "POST",
                        url: "{% url 'service_api' %}",
                        dataType: "json",
                        data: data,
                        success: function(res) {
                            if (res.code == 0) {
                                layer.msg(res.msg, {icon: 6});

                                location.reload()

                            } else if (res.code == 1){
                                layer.msg(res.msg, {icon: 5})
                            }
                        },
                        error: function (res) {
                            layer.msg("服务器接口异常！", {icon: 5})
                        }
                    })

                });
            }
        })
    })
});

    </script>
{% endblock %}
