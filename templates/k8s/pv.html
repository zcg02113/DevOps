{% extends 'index.html' %}
{% block title %}PV{% endblock %}
{% block item-1 %}layui-nav-itemed{% endblock %}
{% block item-1-3 %}layui-this{% endblock %}
{% block  context %}
    {% csrf_token %}
    <span class="layui-breadcrumb"> {# 面板屑----功能模块/node #}
        <a href="{% url 'home' %}">首页</a>
        <a href="#">Kubernetes</a>
        <a href="#">PV</a>
    </span>
    <div class="layui-card" style="display: none" id="create">
        <div class="layui-card-body">

        <fieldset class="layui-elem-field layui-field-title" style="margin-top: 20px;">
          <legend>创建PersistentVolume</legend>
        </fieldset>

        <form class="layui-form " onclick="return false">
            <div class="layui-form-item">
                <label class="layui-form-label">名称：</label>
                <div class="layui-input-block">
                  <input type="text" name="name" lay-verify="required" lay-reqtext="名称是必填项，不能为空！" placeholder="" autocomplete="off" class="layui-input">
                </div>
            </div>

            <div class="layui-form-item" pane="">
                <label class="layui-form-label">存储容量：</label>
                <div class="layui-input-block">
                  <input type="radio" name="capacity" value="1Gi" title="1Gi" checked="">
                  <input type="radio" name="capacity" value="5Gi" title="5Gi">
                  <input type="radio" name="capacity" value="10Gi" title="10Gi">
                  <input type="radio" name="capacity" value="20Gi" title="20Gi" >
                  <input type="radio" name="capacity"  title="自定义" disabled="">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">访问模式：</label>
                <div class="layui-input-block">
                  <input type="radio" name="access_mode" value="ReadWriteMany" title="多节点读写" checked="">
                  <input type="radio" name="access_mode" value="ReadOnlyMany" title="多节点只读">
                  <input type="radio" name="access_mode" value="ReadWriteOnce" title="单节点读写">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">存储类型：</label>
                <div class="layui-input-inline">
                <select name="storage_class">
                  <option value=""></option>
                  <optgroup label="单点存储(适合非核心业务)">
                    <option value="nfs">NFS</option>
                  </optgroup>
                  <optgroup label="分布式存储(暂不支持)">
                    <option value="cephfs">CephFS</option>
                    <option value="cephrbd">CephRBD</option>
                  </optgroup>
                </select>
                </div>
            </div>

            <div class="layui-form-item" style="padding-left: 30px">
                 <label class="layui-form-label">服务器IP：</label>
                 <div class="layui-input-block">
                   <select name="server_ip"  lay-verify="required" lay-search="" lay-filter="select_ns2">
                      <option value="">直接选择或搜索选择</option>
                      <option value="192.168.31.62">192.168.31.62</option>
                      <option value="192.168.31.63">192.168.31.63</option>
                    </select>
                 </div>
                    <br>
                 <label class="layui-form-label" >挂载路径：</label>
                 <div class="layui-input-block">
                  <input type="text" name="mount_path" lay-verify="required" lay-reqtext="名称是必填项，不能为空！" placeholder="示例：pv0001" autocomplete="off" class="layui-input">
                 </div>
              </div>

              <div class="layui-form-item">
                <div class="layui-input-block">
                  <button type="submit" class="layui-btn" lay-submit="" lay-filter="btn">立即提交</button>
                  <button type="reset" class="layui-btn layui-btn-primary">重置</button>
                </div>
              </div>
        </form>
        </div>
    </div>
    <div class="layui-card-body">
        <div class="layui-row">
            <div class="layui-col-md12" >
                <input type="text" name="username" lay-verify="title" placeholder="请输入名称" class="layui-input" style="width: 150px;float: left">
                <button class="layui-btn" id="searchBtn" style="float: left">搜索</button>
                <button class="layui-btn" id="createPV">创建</button>
            </div>
            <div class="layui-col-md12" style="margin-top: 10px">
	            <table id="demo" lay-filter="test"></table>
            </div>
            <script type="text/html" id="barDemo">
                    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
            </script>
        </div>
    </div>
{% endblock %}
{% block js %}
    <script>
        layui.use(['table','form'], function() {
            var table = layui.table;
            var $ = layui.jquery
            var form = layui.form;
            table.render({
                elem: '#demo' // 选择标签
                , url: '/k8s/pv_api/' //数据接口
                , id: 'TT'
                , page: true //开启分页
                , toolbar: '#toolbarDemo' //开启头部工具栏，并为其绑定左侧模板
                , defaultToolbar: ['filter', 'exports', 'print', { //自定义头部工具栏右侧图标。如无需自定义，去除该参数即可
                    title: '刷新'
                    ,layEvent: 'LAYTABLE_TIPS'
                    ,icon: 'layui-icon-refresh'
                    ,onClick: function(obj) {
                        location.reload()
                    }
                }]
                , cols: [[ //表头
                    {field: 'name', title: '名称', sort: true}
                    , {field: 'capacity', title: '容量'}
                    , {field: 'access_modes', title: '访问模式'}
                    , {field: 'reclaim_policy', title: '回收策略'}
                    , {field: 'status', title: '状态'}
                    , {field: 'pvc', title: 'PVC(命名空间/名称)'}
                    , {field: 'storage_class', title: '存储类'}
                    , {field: 'create_time', title: '创建时间'}
                    , {fixed: 'right', title: '操作', toolbar: '#barDemo', width: 150}
                ]]
            });
            $(document).on('click', '#searchBtn', function () {
                var input_val = $('.layui-input').val();    //获取输入的内容
                // var input_val = $("input[name='username']").val();
                table.reload('TT', {
                    where: {   //设定异步数据接口的额外参数，任意设置
                        search_key: input_val
                    },
                    page: {
                        curr: 1  //重新从第 1 页开始
                    }
                })
            })
            table.on('tool(test)', function(obj){
                var data = obj.data;
                var csrf_token = $('[name="csrfmiddlewaretoken"]').val();
                if(obj.event === 'del'){
                    layer.confirm('真的删除行么？', function(index){
                        $.ajax({
                            type: "DELETE",
                            url: '{% url 'pv_api' %}',
                            data: data,
                            headers: {'X-CSRFToken': csrf_token},  // 放到请求头，django也会验证这字段
                            success: function (result) {
                                if (result.code === '0') {

                                    obj.del();  // 临时删除当前页面记录
                                    layer.msg(result.msg,{icon: 6})
                                } else {
                                    layer.msg(result.msg,{icon: 5})
                                }
                            },
                            error: function (){
                                layer.msg('服务器接口异常！')
                            }
                        });
                    });
                }
            });
            $("#createPV").on("click", function () {
                layer.open({
                    type: 1,
                    content: $('#create').html(),   //每次点击会复制id=create的html到弹出层
                    area: ['1000px','550px']
                    , success: function (index, layero) {
                        form.render('select');  //渲染表单属性的下拉框和单选框
                        form.render('radio');
                        form.on('submit(btn)', function (data) {   //监控提交按钮(lay-filter="btn")
                            console.log(data.field)
                            data = data.field;
                            var csrf_token = $("input[name='csrfmiddlewaretoken']").val();
                            data['csrfmiddlewaretoken'] = csrf_token;
                            $.ajax({
                                type: "POST",
                                url: "{% url 'pv_api' %}",
                                dataType: "json",
                                data: data,
                                success: function(res) {
                                    if (res.code == 0) {
                                        layer.msg(res.msg, {icon: 6});
                                    } else if (res.code == 1){
                                        layer.msg(res.msg, {icon: 5})
                                    }
                                },
                                error: function (res) {
                                    layer.msg("服务器接口异常！", {icon: 5})
                                }
                            })
                        })
                    }
                })
            })
        })
    </script>

{% endblock %}
