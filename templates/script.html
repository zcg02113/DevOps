{% extends 'index.html' %}
{% block title %}自动化脚本{% endblock %}
{% block  context %}
    <style>
    body {
      background-color: #f2f2f2;
      padding: 20px;
    }
    .layui-form-label {
        width: 100px; /* 统一标签宽度 */
    }
    .layui-input-block {
        margin-left: 130px; /* 调整输入框的左边距 */
    }
    /* 为了更好的代码编写体验，使用等宽字体 */
    #scriptContent {
        font-family: 'Courier New', Courier, monospace;
        height: 350px; /* 增加代码区域的高度 */
        resize: vertical; /* 允许用户垂直调整大小 */
    }
    </style>
     <span class="layui-breadcrumb">
        <a href="#">首页</a>
        <a><cite>自动化脚本</cite></a>
    </span>
    <hr>
    <div class="layui-card" style="display: none" id="running">
        <div class="layui-card-body">

        <fieldset class="layui-elem-field layui-field-title" style="margin-top: 20px;">
          <legend>运行脚本</legend>
        </fieldset>

        <form class="layui-form " onclick="return false">

            <div class="layui-form-item">
                <label class="layui-form-label">名称：</label>
                <div class="layui-input-block">
                  <input type="text" name="script_name" lay-verify="required" id="modalScriptName" lay-reqtext="名称是必填项，不能为空！" placeholder="" autocomplete="off" class="layui-input" disabled="disabled">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">脚本描述：</label>
                <div class="layui-input-block">
                  <input type="text" name="script_description" lay-verify="required" id="modalScriptDesc"  placeholder="" autocomplete="off" class="layui-input" disabled="disabled">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">脚本格式类型：</label>
                <div class="layui-input-block">
                    <input type="radio" name="script_type" value="YAML" title="YAML" id="radio1" disabled>
                    <input type="radio" name="script_type" value="Shell" title="Shell" id="radio2" disabled>
                </div>
            </div>
             <div class="layui-form-item" id="runModeWrapper">
                <label class="layui-form-label">运行方式：</label>
                <div class="layui-input-block">
                    <select name="run_mode" lay-verify="required" >
                        <option value="">请选择运行方式</option>
                        <option value="Job" id="run_mode1">Job</option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item" >
                <label class="layui-form-label">命名空间：</label>
                <div class="layui-input-block">
                    <select name="namespace"  lay-verify="required" id="ns">
                    </select>
                </div>
             </div>
            <div class="layui-form-item">
                <div class="layui-input-block" style="margin-top: 50px">
                    <button type="submit" class="layui-btn" lay-submit="" lay-filter="btn">运行脚本</button>
                </div>
            </div>
        </form>
        </div>
    </div>
    <div class="layui-card" style="display: none" id="create">
        <div class="layui-card-body">

        <fieldset class="layui-elem-field layui-field-title" style="margin-top: 20px;">
          <legend>创建脚本</legend>
        </fieldset>

        <form class="layui-form " onclick="return false">

            <div class="layui-form-item">
                <label class="layui-form-label">名称：</label>
                <div class="layui-input-block">
                  <input type="text" name="name" lay-verify="required" lay-reqtext="名称是必填项，不能为空！" placeholder="" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">脚本描述：</label>
                <div class="layui-input-block">
                  <input type="text" name="script_description" lay-verify="required"  placeholder="" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item layui-form-text">
                <label class="layui-form-label">脚本内容 <span style="color: red;">*</span></label>
                <div class="layui-input-block">
                    <textarea id="scriptContent" name="content" lay-verify="required" placeholder="在此处输入你的脚本内容...


# --- Shell 脚本示例 ---
# echo 'Hello World'
# kubectl get pods

# --- YAML 示例 ---
# apiVersion: v1
# kind: Pod
# metadata:
#   name: my-pod
" class="layui-textarea"></textarea>
                </div>
            </div>

            <div class="layui-form-item">
                <div class="layui-input-block">
                  <button type="submit" class="layui-btn" lay-submit="" lay-filter="btn">立即提交</button>
                  <button type="reset" class="layui-btn layui-btn-primary">重置</button>
                </div>
            </div>

        </form>
        </div>
    </div>
    <div class="layui-card">
        {% csrf_token %}
        <div class="layui-card-body">
            <div class="layui-row">
                <div class="layui-col-md12">
                    <input type="text" name="name" lay-verify="title" placeholder="请输入名称" class="layui-input" style="width: 150px;float: left">
                    <button class="layui-btn" id="searchBtn" style="float: left">搜索</button>
                    <button class="layui-btn" id="createDe">创建</button>
                </div>

                <div class="layui-col-md12" style="margin-top: 10px">
                    <table id="demo" lay-filter="test"></table>
                    <!--  行工具 -->
                    <script type="text/html" id="barDemo">
                        <a class="layui-btn layui-btn-xs" lay-event="yaml">详情</a>
                        <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
                        <a class="layui-btn layui-btn-xs" lay-event="run" >运行</a>
                    </script>
                </div>

            </div>
        </div>
    </div>
{% endblock %}
{% block js %}
    <script>
        //获取当前命名空间
    var storage = window.sessionStorage;
    var namespace = storage.getItem('namespace');   //从session获取namespace的值layui.use('table',function (){


    layui.use(['table','layer','form'], function(){
    var table = layui.table;
    var $ = layui.jquery
    var layer = layui.layer;
    var form = layui.form
    table.render({
        elem: '#demo'
        ,url: '/k8s/script_api/'
        ,page: true
        ,toolbar: '#toolbarDemo' //开启头部工具栏，并为其绑定左侧模板
        ,defaultToolbar: ['filter', 'exports', 'print', { //自定义头部工具栏右侧图标。如无需自定义，去除该参数即可
            title: '刷新'
            ,layEvent: 'LAYTABLE_TIPS'
            ,icon: 'layui-icon-refresh'
            ,onClick: function(obj) {
                location.reload()
            }
        }]
        ,cols: [[
          {field: 'id', title: 'id'}
          ,{field: 'name', title: '名称', sort: true}
          ,{field: 'description', title: '描述'}
          ,{fixed: 'right', title:'操作', toolbar: '#barDemo', width:200}
        ]],
        id: 'TT',
      });
      table.on('tool(test)', function(obj){
      var data = obj.data;
      var csrf_token = $('[name="csrfmiddlewaretoken"]').val();
      var content = data.content
      if(obj.event == 'del'){
          layer.confirm('真的要删除这个脚本吗？', function(index){
            $.ajax({
                type: "DELETE",
                url: "{% url 'script_api' %}",
                data: data,
                headers: {'X-CSRFToken': csrf_token},  // 放到请求头，django也会验证这字段
                success: function (result) {
                    if (result.code == '0') {
                        layer.msg(result.msg, {icon: 6})
                    } else {
                        layer.msg(result.msg, {icon: 5})
                    }
                },
                error: function () {
                    layer.msg("服务器接口异常！", {icon: 5})
                }
            });
            layer.close(index);
          });
      } else if(obj.event == 'yaml'){
          layer.open({
                title: 'YAML',
                type: 2,  //内嵌层，从另一个网址加载
                area: ['60%','60%'],
                content: '{% url 'ace_editor' %}?resource=script&' + 'id=' + data['id']
            })
      }else if(obj.event == 'details'){
            window.location.href='{% url 'deployment_details' %}?namespace=' + data['namespace']
      }
      else if(obj.event == 'run'){
          layer.open({            //点击触发弹出层
                type: 1,
                area: ['50%','60%'],
                content: $('#running')  //让id=create的页面显示
                ,success: function (index, layero) {
                    $('#runModeWrapper').hide();        //隐藏下拉框
                    $('#runModeWrapper select[name="run_mode"]').prop('disabled', true); //禁用下拉框的这个字段
                    $('select[name="run_mode"]').removeAttr('lay-verify');  //lay-verify设置为必填项,为yaml的时候移除必填
                    $('#modalScriptName').val(data.name);           //名称框为当前脚本名称
                    $('#modalScriptDesc').val(data.description);    //描述为当前的描述
                    var csrf_token = $("input[name='csrfmiddlewaretoken']").val();
                    data['csrfmiddlewaretoken'] = csrf_token;
                    data['run'] = 1;
                    $.ajax({
                        type: 'GET',
                        url: '{% url 'namespace_api' %}',
                        success: function (res) {
                            if (res.code === 0) {
                                for (let index in res.data) {
                                    row = res.data[index];
                                    $('#ns').append('<option value=' + row.name + '>' + row.name + '</option>')
                                }
                                form.render('select');  //渲染表单属性的下拉框和单选框(需在访问api之后再进行渲染)
                            }else {
                                layer.open({
                                    type: 0,
                                    title: ['命名空间查询失败'],
                                    content: '<span style="color: red ;font-size: 18px">' + res.msg + '</span>'
                                })
                            }
                        },
                        error: function (){
                            layer.open({
                                type: 0,
                                title: ['异常信息'],
                                content: '获取命名空间列表失败！请检查k8s集群地址或者服务器！'
                            })
                        }
                    });
                    $.ajax({
                        type: "POST",
                        url: "{% url 'script_api' %}",
                        data: data,
                        success: function(res) {
                            $('select[name="run_mode"]').val('');
                            $("#run_mode1").prop('disabled', false);
                            $("#run_mode2").prop('disabled', false);
                            if (res.message == 'YAML'){
                                $("#radio1").prop("checked", true);
                            }
                            else if (res.message == 'Shell'){
                                $("#radio2").prop("checked", true);
                                $('#runModeWrapper').show();    //显示下拉框
                                $('#runModeWrapper select[name="run_mode" ]').prop('disabled', false); //启用改字段
                                $('select[name="run_mode"]').attr('lay-verify', 'required');    //为shell的时候必填
                            }
                            form.render('radio');
                            form.render('select');
                        },
                        error: function (res) {
                            layer.msg("服务器接口异常！", {icon: 5})
                        }
                    })
                form.render('checkbox');
                form.on('submit(btn)', function(data){      //点击提交获取表单数据
                    data = data.field;
                    data['content'] = content
                    console.log(data)
                    var csrf_token = $("input[name='csrfmiddlewaretoken']").val();
                    data['csrfmiddlewaretoken'] = csrf_token;
                    $.ajax({
                        type: "POST",
                        url: "{% url 'script_api' %}",
                        data: data,
                        success: function(res) {
                            if (res.code == 0) {
                                layer.msg(res.msg, {icon: 6});
                                location.reload()
                            } else if (res.code == 1){
                                layer.msg(res.msg, {icon: 5})
                            }
                        },
                        error: function (res) {
                            layer.msg("服务器接口异常！", {icon: 5})
                        }
                    })

                });
            }
        })
      }
    });
    // 监听搜索事件
    $(document).on('click','#searchBtn', function () {
        var input_val = $('.layui-input').val();
       // var input_val = $("input[name='name']").val();
        table.reload('TT', {
            where: {   //设定异步数据接口的额外参数，任意设置
                search_key: input_val
            },
            page: {
                curr: 1  //重新从第 1 页开始
            }
        })
    })
    $("#createDe").on("click", function () {    //点击创建触发
        layer.open({            //点击触发弹出层
            type: 1,
            area: ['60%','60%'],
            content: $('#create')  //让id=create的页面显示
            ,success: function (index, layero) {
                form.render('radio');
                form.render('checkbox');

                form.on('submit(btn)', function(data){      //点击提交获取表单数据
                    data = data.field;
                    var csrf_token = $("input[name='csrfmiddlewaretoken']").val();
                    data['csrfmiddlewaretoken'] = csrf_token;
                    $.ajax({
                        type: "POST",
                        url: "{% url 'script_api' %}",
                        data: data,
                        success: function(res) {
                            if (res.code == 0) {
                                layer.msg(res.msg, {icon: 6});


                            } else if (res.code == 1){
                                layer.msg(res.msg, {icon: 5})
                            }
                        },
                        error: function (res) {
                            layer.msg("服务器接口异常！", {icon: 5})
                        }
                    })

                });
            }
        })
    })
});
</script>
{% endblock %}
